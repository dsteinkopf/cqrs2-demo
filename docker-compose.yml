services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cqrs2
      POSTGRES_USER: cqrs2
      POSTGRES_PASSWORD: cqrs2
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqrs2"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
